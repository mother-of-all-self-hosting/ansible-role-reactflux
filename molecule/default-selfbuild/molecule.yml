---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  # The name embeds both the role and the scenario, so that scenarios running in
  # parallel - here or on a shared CI runner - cannot collide.
  - name: reactflux-${MOLECULE_DISTRO:-ubuntu2604}-default-selfbuild
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Where the verification tasks reach ReactFlux. Ansible runs inside the
        # platform container, which is where the Docker daemon it installed
        # publishes container ports.
        reactflux_molecule_base_url: "http://127.0.0.1:{{ reactflux_container_http_host_bind_port }}"

        reactflux_uid: 1000
        reactflux_gid: 1000

        reactflux_scheme: http
        reactflux_hostname: reactflux-selfbuild.molecule.example.com

        # Deliberately not the same as the container port, so that a port mapping
        # which merely echoed the container port would not pass verification.
        # Also not the port the `default` scenario uses, so that the two cannot
        # be confused for one another when they run side by side.
        reactflux_container_http_host_bind_port: 21988
        reactflux_container_http_port: 2000

        # Values only templates/env.j2 could have put into the container, and
        # different from the ones the `default` scenario uses.
        reactflux_environment_variables_tz: Asia/Tokyo
        reactflux_environment_variables_additional_variables: MASH_MOLECULE_SCENARIO=reactflux-default-selfbuild

        # The `default` scenario exercises templates/labels.j2 with the labels
        # on; this one asserts that turning them off renders nothing.
        reactflux_container_labels_traefik_enabled: false

        # Test self-building.
        #
        # The image name is spelled out rather than left to its Jinja-derived
        # default, and is a name that exists in no registry - so a container
        # running it can only have been built here, and a silent fall back to a
        # pulled image cannot pass verification.
        reactflux_container_image_self_build: true
        reactflux_container_image_self_build_name: reactflux-molecule/reactflux:selfbuild
        reactflux_container_image_self_build_src_files_path: /reactflux/docker-src
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
