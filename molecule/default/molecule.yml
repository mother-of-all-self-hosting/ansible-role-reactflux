---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  # The name embeds both the role and the scenario, so that scenarios running in
  # parallel - here or on a shared CI runner - cannot collide.
  - name: reactflux-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Where the verification tasks reach ReactFlux. Ansible runs inside the
        # platform container, which is where the Docker daemon it installed
        # publishes container ports.
        reactflux_molecule_base_url: "http://127.0.0.1:{{ reactflux_container_http_host_bind_port }}"

        reactflux_uid: 1000
        reactflux_gid: 1000

        reactflux_scheme: http

        # A hostname nothing would produce by accident, so that the Traefik
        # router rule the role renders can be checked against it.
        reactflux_hostname: reactflux-default.molecule.example.com

        # Deliberately not the same as the container port, so that a port mapping
        # which merely echoed the container port would not pass verification.
        reactflux_container_http_host_bind_port: 21987
        reactflux_container_http_port: 2000

        # Values only templates/env.j2 could have put into the container.
        reactflux_environment_variables_tz: Europe/Sofia
        reactflux_environment_variables_additional_variables: MASH_MOLECULE_SCENARIO=reactflux-default

        # This scenario exercises templates/labels.j2; `default-selfbuild` turns
        # the labels off and asserts that nothing at all is rendered.
        reactflux_container_labels_traefik_enabled: true
        reactflux_container_labels_traefik_entrypoints: web

        # An extra mount, so that the `--mount` loop in the systemd unit template
        # is exercised rather than merely present. /etc/hostname is a file that
        # exists on every platform image and that nothing in the container reads.
        reactflux_container_additional_volumes_custom:
          - type: bind
            src: /etc/hostname
            dst: /molecule-additional-volume
            options: readonly
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
