# Verifies the pre-built image ReactFlux publishes on Docker Hub, with the
# Traefik labels turned on so that templates/labels.j2 is exercised.
#
# This is the path almost every operator takes: `reactflux_container_image_self_build`
# is false by default, so the role pulls `electh/reactflux` at the tag
# `reactflux_version` names and runs it behind Traefik.

---
- name: Verify ReactFlux
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify that ReactFlux works
      block:
        - name: Run the shared ReactFlux verification tasks
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

        ########################################################################
        #                                                                      #
        # the image is the one defaults/main.yml names                         #
        #                                                                      #
        ########################################################################

        # ReactFlux publishes no versions, so there is no running version to
        # compare a pinned one against: `electh/reactflux` carries `latest`, a
        # per-commit hash tag, and nothing else. The most that can be checked is
        # that the tag the role resolved is the tag that is running - which is
        # also what would notice if the self-build path leaked into this
        # scenario and ran a locally built image instead.
        - name: Assert that the running container is the image defaults/main.yml resolves to
          ansible.builtin.assert:
            that:
              - reactflux_molecule_container.Config.Image is search('electh/reactflux:')
              - reactflux_molecule_container.Config.Image.endswith(':' ~ reactflux_role_defaults.reactflux_version)
            fail_msg: >-
              The container runs {{ reactflux_molecule_container.Config.Image }}, which is not
              electh/reactflux at the '{{ reactflux_role_defaults.reactflux_version }}' tag
              `reactflux_version` names
            success_msg: >-
              The container runs {{ reactflux_molecule_container.Config.Image }}, the tag
              `reactflux_version` names

        # A tripwire rather than a check of the role. The image's OCI labels come
        # from the `caddy:2` base image the upstream Dockerfile ends on and say
        # nothing about ReactFlux, which is why neither this suite nor
        # .github/renovate.json treats `org.opencontainers.image.version` as a
        # version of ReactFlux. If ReactFlux ever starts labelling its own
        # images, this fails and says to go and use them.
        - name: Assert that the image's OCI version label is still the base image's
          vars:
            reactflux_molecule_labels: "{{ reactflux_molecule_container.Config.Labels }}"
          ansible.builtin.assert:
            that:
              - reactflux_molecule_labels['org.opencontainers.image.title'] == 'Caddy'
              - reactflux_molecule_labels['org.opencontainers.image.source'] == 'https://github.com/caddyserver/caddy-docker'
            fail_msg: >-
              The image's OCI labels are no longer Caddy's
              (title '{{ reactflux_molecule_labels['org.opencontainers.image.title'] | default('none') }}',
              version '{{ reactflux_molecule_labels['org.opencontainers.image.version'] | default('none') }}').
              If ReactFlux now labels its own images, that is a version surface this role and
              .github/renovate.json should be using, and this assertion should be replaced by one
              that compares the label against `reactflux_version`.
            success_msg: >-
              The image's OCI labels still describe Caddy
              {{ reactflux_molecule_labels['org.opencontainers.image.version'] }}, not ReactFlux,
              so there is still no version label to track

        ########################################################################
        #                                                                      #
        # the mounts the role was asked to add                                 #
        #                                                                      #
        ########################################################################

        # `reactflux_container_additional_volumes` is a documented way to mount
        # your own files into the container, and until this scenario existed the
        # systemd unit template had no `--mount` loop at all - so setting it did
        # nothing whatsoever, silently. This is what keeps that from happening
        # again.
        - name: Assert that the additional volume the scenario asked for is mounted
          vars:
            reactflux_molecule_extra_mount: >-
              {{ reactflux_molecule_container.Mounts | selectattr('Destination', 'equalto', '/molecule-additional-volume') | list }}
          ansible.builtin.assert:
            that:
              - reactflux_molecule_extra_mount | length == 1
              - (reactflux_molecule_extra_mount | first).Type == 'bind'
              - (reactflux_molecule_extra_mount | first).Source == '/etc/hostname'
              - not (reactflux_molecule_extra_mount | first).RW
            fail_msg: >-
              /molecule-additional-volume is not mounted read-only from /etc/hostname. The
              container's mounts are {{ reactflux_molecule_container.Mounts }}.
            success_msg: >-
              The extra volume `reactflux_container_additional_volumes_custom` names is mounted
              read-only at /molecule-additional-volume

        ########################################################################
        #                                                                      #
        # the labels the role renders for Traefik                              #
        #                                                                      #
        ########################################################################

        # This scenario turns the Traefik labels on (the self-build one leaves
        # them off, and asserts they are absent) so that templates/labels.j2 is
        # exercised. No Traefik is running to read them, but the labels are
        # rendered from the role's variables and reach the container through
        # `--label-file`, so what they say is a statement about the role.
        - name: Assert that the Traefik labels the role renders reached the container
          vars:
            reactflux_molecule_labels: "{{ reactflux_molecule_container.Config.Labels }}"
          ansible.builtin.assert:
            that:
              - reactflux_molecule_labels['traefik.enable'] == 'true'
              - reactflux_molecule_labels['traefik.docker.network'] == 'reactflux'
              - reactflux_molecule_labels['traefik.http.routers.reactflux.rule'] == 'Host(`' ~ reactflux_hostname ~ '`)'
              - reactflux_molecule_labels['traefik.http.routers.reactflux.entrypoints'] == reactflux_container_labels_traefik_entrypoints
              - reactflux_molecule_labels['traefik.http.routers.reactflux.tls'] == 'false'
              - reactflux_molecule_labels['traefik.http.services.reactflux.loadbalancer.server.port'] == reactflux_container_http_port | string
              - reactflux_molecule_labels['traefik.http.middlewares.reactflux-add-response-headers.headers.customresponseheaders.X-Content-Type-Options'] == 'nosniff'
              - reactflux_molecule_labels['traefik.http.middlewares.reactflux-add-response-headers.headers.customresponseheaders.Content-Security-Policy'] == reactflux_role_defaults.reactflux_http_header_content_security_policy
            fail_msg: "The container's labels are {{ reactflux_molecule_labels }}"
            success_msg: >-
              The container carries the Traefik router, service and response-header labels
              templates/labels.j2 renders, routing `{{ reactflux_hostname }}` to container port
              {{ reactflux_container_http_port }}

        # `reactflux_container_labels_traefik_entrypoints` is `web` in this
        # scenario, and `reactflux_container_labels_traefik_tls` is derived from
        # it. Traefik's TLS-only labels must not be rendered at all in that case,
        # and neither must the Strict-Transport-Security response header.
        - name: Assert that no TLS-only labels are rendered for a plain-HTTP entrypoint
          vars:
            reactflux_molecule_labels: "{{ reactflux_molecule_container.Config.Labels }}"
          ansible.builtin.assert:
            that:
              - "'traefik.http.routers.reactflux.tls.certResolver' not in reactflux_molecule_labels"
              - >-
                'traefik.http.middlewares.reactflux-add-response-headers.headers.customresponseheaders.Strict-Transport-Security'
                not in reactflux_molecule_labels
            fail_msg: >-
              The container carries a TLS-only label even though the entrypoint is
              '{{ reactflux_container_labels_traefik_entrypoints }}':
              {{ reactflux_molecule_labels }}
            success_msg: >-
              Neither the certResolver label nor the Strict-Transport-Security header is rendered
              for the '{{ reactflux_container_labels_traefik_entrypoints }}' entrypoint

        - name: Show ReactFlux verification summary
          ansible.builtin.debug:
            msg:
              - "ReactFlux systemd: {{ reactflux_service.status.ActiveState }}"
              - "ReactFlux image: {{ reactflux_molecule_container.Config.Image }} behind {{ reactflux_index.server }}"
              - "ReactFlux published: container {{ reactflux_container_http_port }} on host {{ reactflux_container_http_host_bind_port }}"
              - "ReactFlux mounts: /molecule-additional-volume, read-only, as the role was asked"
              - "ReactFlux bundle: {{ reactflux_molecule_bundle_paths | first }} as {{ reactflux_bundle.content_type }}"
              - "ReactFlux build: commit {{ reactflux_molecule_build_hash }} of {{ reactflux_molecule_build_date }}"
              - "ReactFlux missing paths: the application shell, so the content type above means something"
      rescue:
        # Whatever went wrong, the reason is almost always in the service log.
        - name: Retrieve the ReactFlux service log
          ansible.builtin.command:
            cmd: journalctl --no-pager -xeu reactflux.service
          register: reactflux_service_log
          changed_when: false

        - name: Show the ReactFlux service log
          ansible.builtin.debug:
            var: reactflux_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "ReactFlux verification failed. The service log is printed above."
