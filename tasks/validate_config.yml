---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "reactflux_http_header_content_permission_policy", "new": "reactflux_http_header_permissions_policy" }
    - { "old": "reactflux_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required ReactFlux settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - reactflux_uid
    - reactflux_gid
    - reactflux_hostname
    - reactflux_path_prefix
    - reactflux_container_network

# The Caddyfile baked into the container image says `:2000` literally, so this
# variable describes the image rather than configuring it. See the comment on it
# in `defaults/main.yml`.
- name: Fail if reactflux_container_http_port is not the port the container image listens on
  ansible.builtin.fail:
    msg: >-
      reactflux_container_http_port (`{{ reactflux_container_http_port }}`) must be `2000`.
      The Caddyfile baked into the ReactFlux container image listens on `:2000` literally, so this
      variable describes the image rather than configuring it. Changing it does not move the port
      ReactFlux listens on - it only points the port mapping
      (`reactflux_container_http_host_bind_port`) and the Traefik service label at a port that
      nothing is listening on.
  when: "reactflux_container_http_port | int != 2000"

- name: Run if Traefik is enabled
  when: reactflux_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for ReactFlux are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "reactflux_container_labels_traefik_hostname", when: true }
        - { "name": "reactflux_container_labels_traefik_path_prefix", when: true }
        - { "name": "reactflux_container_labels_traefik_middleware_basic_auth_users", when: "{{ reactflux_container_labels_traefik_middleware_basic_auth_enabled }}" }

    - name: Fail if reactflux_container_labels_traefik_path_prefix is different than /
      ansible.builtin.fail:
        msg: >-
          reactflux_container_labels_traefik_path_prefix (`{{ reactflux_container_labels_traefik_path_prefix }}`) must be `/`.
          ReactFlux does not support hosting under a subpath yet.
      when: "reactflux_container_labels_traefik_path_prefix != '/'"

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `reactflux_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if reactflux_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          reactflux_container_labels_traefik_path_prefix (`{{ reactflux_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/reactflux`).
      when: "reactflux_container_labels_traefik_path_prefix != '/' and reactflux_container_labels_traefik_path_prefix[-1] == '/'"
